[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "papermap"
version = "0.1.0"
description = "Turn a scientific paper into an interactive, audience-adapted, podcast-style learning experience."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "PaperMap contributors" }]
keywords = ["papers", "llm", "podcast", "education", "knowledge-graph", "tts"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
edge-tts = ["edge-tts>=6.1"]
ui = ["keyring>=24"]
all = ["anthropic>=1.0", "edge-tts>=6.1", "keyring>=24"]
dev = ["pytest>=8"]

[project.scripts]
papermap = "papermap.cli:main"

[project.urls]
Homepage = "https://github.com/iFarhat93/papermap"

[tool.hatch.build.targets.wheel]
packages = ["src/papermap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
